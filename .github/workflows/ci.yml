# Every PR and push to main: checks, the Python end-to-end render, and installers for all
# three platforms (attached to the run as artifacts for a week).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64 -c.mac.identity=- # ad-hoc: unsigned bundles count as "damaged" once downloaded
          - os: windows-latest
            target: --win --x64
          - os: ubuntu-latest
            target: --linux --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run fetch-pixi
      - name: Python runner tests (renders a fixture project)
        working-directory: python
        run: ../resources/bin/pixi${{ runner.os == 'Windows' && '.exe' || '' }} run python -m unittest discover -v tests
      - name: Xcode 26+ (compiles the Icon Composer icon)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: manim-studio-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          retention-days: 7
