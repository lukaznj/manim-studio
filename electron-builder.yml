# Packaging and auto-update. Release process: docs/06-operations/releasing.md
appId: cc.razem.manimstudio
productName: Manim Studio
copyright: Copyright © 2026 Luka Ražem
directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!out/mcpb/**'
  - '!out/*.mcpb'
  # The Codex CLI is installed on demand (src/main/codex.ts), not shipped: it's about 340 MB.
  - '!node_modules/@openai/codex/**'
  - '!node_modules/@openai/codex-{darwin,linux,win32}-*/**'

# The Claude Code binary is spawned, so it must live outside the asar archive.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**

extraResources:
  - from: python
    to: python
    filter: ['**/*', '!**/__pycache__/**', '!.pixi/**', '!tests/**']
  - from: templates
    to: templates
  - from: resources/bin # pixi, from `npm run fetch-pixi` for the target platform
    to: bin
  - from: out/manim-studio.mcpb # the Claude Desktop extension (scripts/build-mcpb.mjs)
    to: manim-studio.mcpb
  - from: out/mcpb/server/index.js # the same bridge, run by Codex for Studio's tools (src/main/codex.ts)
    to: mcp-bridge.js

# Claude Desktop's extension starts Studio with manim-studio:// on Windows and Linux (macOS uses the bundle id).
protocols:
  - name: Manim Studio
    schemes: [manim-studio]

# Gives Electron's helper apps the app icon (Activity Monitor shows them).
afterPack: scripts/helper-icons.cjs

mac:
  target:
    - target: dmg
    - target: zip # what the updater downloads; latest-mac.yml points at it
  category: public.app-category.education
  # Icon Composer document (Liquid Glass on macOS 26+); electron-builder compiles it with
  # actool (Xcode 26+) into Assets.car plus an .icns fallback for older macOS.
  icon: build/icon.icon
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Manim Studio records your narration for videos.
  # Signing uses CSC_LINK/CSC_KEY_PASSWORD; notarization runs when APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set. Unsigned builds work but
  # can't auto-update on macOS (the app then offers a manual download).

win:
  target: nsis
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}.${ext}

linux:
  target: AppImage # self-updating; .deb would need a maintainer e-mail
  icon: build/icon.png
  category: Education
  synopsis: Code-first editor for manim maths videos
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# Releases live in this (public) repo; installed apps read them without a token.
publish:
  provider: github
  owner: lukaznj
  repo: manim-studio
  releaseType: draft # CI publishes it once all platforms uploaded
