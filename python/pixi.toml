# The Python environment every render runs in. The app copies this file (and
# pixi.lock) into its data folder and runs `pixi install --frozen` there, so
# users never need Xcode, Homebrew or a compiler: conda-forge ships
# prebuilt cairo/pango/pycairo for macOS, Windows and Linux.

[workspace]
name = "manim-studio-env"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]

[dependencies]
python = "3.12.*"
pycairo = "*"
manimpango = "*"
av = "*"
numpy = "*"
# manim-voiceover imports the sox wrapper at startup and warns without the binary.
sox = "*"

[pypi-dependencies]
manim = "==0.21.0"
manim-voiceover = "==0.4.0"

# Optional, installed on demand from Settings: local multilingual TTS (600+ languages)
# with voice cloning (Apache-2.0, ~3.3 GB of weights downloaded on first use).
# torch dropped Intel-mac wheels, so this feature skips osx-64.
[feature.omnivoice]
platforms = ["osx-arm64", "win-64", "linux-64"]

[feature.omnivoice.pypi-dependencies]
omnivoice = "==0.2.1"

# Optional: word timings for human recordings, so bookmarks land on the word.
[feature.transcribe.pypi-dependencies]
faster-whisper = "*"

[environments]
default = { solve-group = "base" }
omnivoice = { features = ["omnivoice"], solve-group = "omnivoice" }
transcribe = { features = ["transcribe"], solve-group = "base" }
